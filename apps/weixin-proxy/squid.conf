# TLS protects proxy authentication. CONNECT preserves Weixin's own TLS session.
https_port 0.0.0.0:@PORT@ cert=/etc/emmm-proxy/fullchain.pem key=/etc/emmm-proxy/privkey.pem options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

visible_hostname emmm-weixin-proxy
pid_filename /run/emmm-proxy/squid.pid
cache_effective_user squid
cache_effective_group squid

acl CONNECT method CONNECT
acl weixin dstdomain -n api.weixin.qq.com
acl tls_port port 443
acl busy_client maxconn 16

auth_param basic program @AUTH_HELPER@ /etc/emmm-proxy/passwords
auth_param basic children 2
auth_param basic realm Weixin proxy
auth_param basic credentialsttl 5 minutes
acl authenticated proxy_auth REQUIRED

http_access deny !CONNECT
http_access deny !tls_port
http_access deny !weixin
http_access deny busy_client
http_access allow authenticated
http_access deny all

connect_timeout 10 seconds
read_timeout 60 seconds
request_timeout 15 seconds
client_lifetime 5 minutes
client_idle_pconn_timeout 30 seconds
request_header_max_size 8 KB
request_body_max_size 16 KB
cache deny all
cache_mem 8 MB
memory_pools off

# CONNECT destinations and status only; no headers, credentials or request bodies.
logformat tunnel %ts.%03tu %>a %Ss/%03>Hs %rm %>rd %tr
access_log stdio:/var/log/emmm-proxy/access.log tunnel
cache_log /var/log/emmm-proxy/cache.log
cache_store_log none
logfile_rotate 0
