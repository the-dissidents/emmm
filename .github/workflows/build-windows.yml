name: Build Windows EXE

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (e.g. v0.2.5)'
        required: true
        default: 'v0.2.5'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'v0.2.5' }}

      - name: Install pnpm v10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/editor/src-tauri -> target'
      - name: Align Tauri NPM package versions with Cargo.lock
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const overrides = {
              "@tauri-apps/api": "~2.10.0",
              "@tauri-apps/cli": "~2.10.0",
              "@tauri-apps/plugin-fs": "~2.5.0",
              "@tauri-apps/plugin-os": "~2.3.0",
              "@tauri-apps/plugin-dialog": "~2.7.0",
              "@tauri-apps/plugin-shell": "~2.3.0",
              "@tauri-apps/plugin-http": "~2.5.0",
              "@tauri-apps/plugin-clipboard-manager": "~2.3.0",
              "@tauri-apps/plugin-opener": "~2.5.0"
            };
            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            rootPkg.pnpm = rootPkg.pnpm || {};
            rootPkg.pnpm.overrides = { ...(rootPkg.pnpm.overrides || {}), ...overrides };
            fs.writeFileSync("package.json", JSON.stringify(rootPkg, null, 2));
          '
      
      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Build workspace packages & Tauri Windows executable
        run: pnpm run build-win

      - name: Upload Windows EXE & Installers as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emmui-windows-${{ github.event.inputs.ref || 'v0.2.5' }}
          path: |
            apps/editor/src-tauri/target/release/kfgui.exe
            apps/editor/src-tauri/target/release/bundle/nsis/*.exe
            apps/editor/src-tauri/target/release/bundle/msi/*.msi
